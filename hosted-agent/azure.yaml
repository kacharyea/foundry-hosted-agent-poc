# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: foundry-hosted-agent-integration-poc
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.16'
services:
    ai-project:
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
        host: azure.ai.project
    integration-agent:
        codeConfiguration:
            entryPoint: foundry-hosted-integration-agent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Read-only C# agent with JSONPlaceholder REST tools and Microsoft Learn MCP.
        displayName: Foundry Hosted Agent Integration POC
        docker:
            path: Dockerfile
            remoteBuild: true
        env:
            POC_CREDENTIAL_MODE: default
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            JSONPLACEHOLDER_BASE_URL: https://jsonplaceholder.typicode.com/
            MICROSOFT_LEARN_MCP_ENDPOINT: https://learn.microsoft.com/api/mcp
            # Synthetic POC only. Disable content capture for real sensitive workloads.
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'true'
        host: azure.ai.agent
        kind: hosted
        language: csharp
        name: foundry-hosted-integration-poc
        project: src/FoundryHostedAgent
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
